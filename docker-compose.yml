name: pardachi

services:
  db:
    image: postgres:17-alpine
    container_name: pardachi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pardachi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pardachi}
      POSTGRES_DB: ${POSTGRES_DB:-pardachi}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pardachi} -d ${POSTGRES_DB:-pardachi}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pardachi]

  backend:
    build:
      context: ./backend
    container_name: pardachi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pardachi}:${POSTGRES_PASSWORD:-pardachi}@db:5432/${POSTGRES_DB:-pardachi}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylida ko'rsatilishi shart}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      FIRST_USER_IS_ADMIN: ${FIRST_USER_IS_ADMIN:-true}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-true}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
      DEV_LOGIN_SECRET: ${DEV_LOGIN_SECRET:-dev-secret}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      TELEGRAM_STORAGE_CHAT_ID: ${TELEGRAM_STORAGE_CHAT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-12}
      RUN_MIGRATIONS: 'true'
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - media:/app/media
    expose:
      - '8000'
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    networks: [pardachi]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: pardachi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    networks: [pardachi]

  bot:
    build:
      context: ./bot
    container_name: pardachi-bot
    restart: unless-stopped
    profiles: ['bot']
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Bot uchun token kerak}
      WEBAPP_URL: ${WEBAPP_URL:?Mini App manzili kerak (https)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [pardachi]

volumes:
  pgdata:
  media:

networks:
  pardachi:
    driver: bridge
